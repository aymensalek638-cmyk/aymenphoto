<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Aymen Salek</title>
    <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Josefin+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --beige: #F5F1E8;
            --grey: #373737;
            --blue-grey: #718596;
            --white: #FFFFFF;
            --black: #1a1a1a;
            --serif: 'Gilda Display', serif;
            --sans: 'Josefin Sans', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--beige);
            color: var(--grey);
            font-family: var(--sans);
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 28px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--beige);
            transition: padding 0.4s ease;
        }

        nav.scrolled {
            padding: 18px 48px;
            box-shadow: 0 1px 0 rgba(55, 55, 55, 0.08);
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 1.5rem;
            letter-spacing: 0.08em;
            color: var(--black);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--grey);
            position: relative;
            padding-bottom: 2px;
        }

        .nav-links a.active { color: var(--black); }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--grey);
            transition: width 0.3s ease;
        }

        .nav-links a.active::after { width: 100%; }
        .nav-links a:hover::after { width: 100%; }

        /* ── HAMBURGER ── */
        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            z-index: 101;
        }

        .nav-toggle span {
            display: block;
            width: 24px;
            height: 1.5px;
            background: var(--grey);
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.4s ease;
        }

        nav.nav-open .nav-toggle span { background: var(--beige); }

        nav.nav-open .nav-toggle span:nth-child(1) {
            transform: translateY(6.5px) rotate(45deg);
        }

        nav.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }

        nav.nav-open .nav-toggle span:nth-child(3) {
            transform: translateY(-6.5px) rotate(-45deg);
        }

        /* ── CATEGORY CARDS ── */
        .categories {
            display: flex;
            min-height: 100vh;
            padding-top: 80px;
        }

        .cat-card {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            border-right: 1px solid rgba(55, 55, 55, 0.08);
        }

        .cat-card:last-child {
            border-right: none;
        }

        .cat-card .cat-image {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(1.08);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .cat-card .cat-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(26, 26, 26, 0.35);
        }

        .cat-card:hover .cat-image {
            opacity: 1;
            transform: scale(1);
        }

        .cat-card .cat-content {
            position: relative;
            z-index: 2;
            text-align: center;
            transition: color 0.6s ease;
        }

        .cat-card .cat-number {
            display: block;
            font-family: var(--serif);
            font-size: 0.85rem;
            color: var(--blue-grey);
            margin-bottom: 20px;
            transition: color 0.6s ease;
        }

        .cat-card:hover .cat-number {
            color: rgba(245, 241, 232, 0.6);
        }

        .cat-card .cat-content h2 {
            font-family: var(--serif);
            font-size: clamp(2.2rem, 4vw, 3.8rem);
            font-weight: 400;
            color: var(--black);
            line-height: 1.1;
            transition: color 0.6s ease;
        }

        .cat-card:hover .cat-content h2 {
            color: var(--beige);
        }

        .cat-card .cat-hint {
            display: block;
            margin-top: 24px;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--blue-grey);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s ease 0.15s, transform 0.4s ease 0.15s, color 0.6s ease;
        }

        .cat-card:hover .cat-hint {
            opacity: 1;
            transform: translateY(0);
            color: rgba(245, 241, 232, 0.7);
        }

        /* Placeholder for category images */
        .ph-cover {
            width: 100%;
            height: 100%;
        }

        .ph-cover-event {
            background: linear-gradient(145deg, var(--grey) 0%, var(--blue-grey) 60%, var(--grey) 100%);
        }

        .ph-cover-sport {
            background: linear-gradient(160deg, var(--blue-grey) 0%, var(--grey) 50%, var(--blue-grey) 100%);
        }

        .ph-cover-video {
            background: linear-gradient(135deg, var(--grey) 0%, var(--blue-grey) 40%, var(--grey) 70%, var(--blue-grey) 100%);
        }

        .cat-card-full {
            display: flex;
            position: relative;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
            overflow: hidden;
            cursor: pointer;
            border-top: 1px solid rgba(55, 55, 55, 0.08);
        }

        /* ── GALLERY SECTIONS ── */
        .gallery-section {
            padding: 120px 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 48px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(55, 55, 55, 0.1);
        }

        .gallery-header h2 {
            font-family: var(--serif);
            font-size: clamp(1.8rem, 3vw, 2.8rem);
            font-weight: 400;
            color: var(--black);
            line-height: 1.15;
        }

        .gallery-header .count {
            font-size: 0.65rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--blue-grey);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .gallery-item.wide {
            grid-column: span 2;
            aspect-ratio: 16/10;
        }

        .gallery-item img {
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .ph {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-align: center;
            padding: 16px;
        }

        .ph-event {
            background: linear-gradient(145deg, var(--grey) 0%, var(--blue-grey) 60%, var(--grey) 100%);
        }

        .ph-sport {
            background: linear-gradient(160deg, var(--blue-grey) 0%, var(--grey) 50%, var(--blue-grey) 100%);
        }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid rgba(55, 55, 55, 0.12);
            padding: 64px 48px;
            background-color: var(--beige);
        }

        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .footer-brand .footer-logo {
            font-family: var(--serif);
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--black);
            margin-bottom: 16px;
        }

        .footer-brand p {
            font-size: 0.8rem;
            color: var(--blue-grey);
            line-height: 1.7;
        }

        .footer-location { text-align: center; }

        .footer-location .label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--blue-grey);
            margin-bottom: 12px;
        }

        .footer-location p {
            font-family: var(--serif);
            font-size: 1.05rem;
            color: var(--grey);
        }

        .footer-social { text-align: right; }

        .footer-social .label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--blue-grey);
            margin-bottom: 16px;
        }

        .social-links {
            display: flex;
            justify-content: flex-end;
            gap: 24px;
        }

        .social-links a {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--blue-grey);
            position: relative;
            padding-bottom: 2px;
        }

        .social-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--grey);
            transition: width 0.3s ease;
        }

        .social-links a:hover::after { width: 100%; }

        .footer-bottom {
            max-width: 1400px;
            margin: 48px auto 0;
            padding-top: 32px;
            border-top: 1px solid rgba(55, 55, 55, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--blue-grey);
            letter-spacing: 0.05em;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 1024px) {
            nav { padding: 24px 32px; }
            .gallery-section { padding: 100px 32px; }
            footer { padding: 48px 32px; }
        }

        @media (max-width: 768px) {
            nav { padding: 20px 24px; }

            .nav-toggle { display: flex; }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background: var(--blue-grey);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 40px;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.4s ease, visibility 0.4s ease;
            }

            .nav-links.open {
                opacity: 1;
                visibility: visible;
            }

            .nav-links a,
            .nav-links a.active {
                font-size: 1.2rem;
                color: var(--beige);
            }

            .nav-links a::after,
            .nav-links a.active::after {
                background: var(--beige);
            }

            .categories {
                flex-direction: column;
                min-height: auto;
                padding-top: 80px;
            }

            .cat-card {
                min-height: 45vh;
                border-right: none;
                border-bottom: 1px solid rgba(55, 55, 55, 0.08);
            }

            .cat-card:last-child { border-bottom: none; }

            .cat-card-full {
                min-height: 45vh;
            }

            .cat-card-full .cat-image {
                opacity: 1;
                transform: scale(1);
            }

            .cat-card-full .cat-content h2 { color: var(--beige); }
            .cat-card-full .cat-number { color: rgba(245, 241, 232, 0.6); }
            .cat-card-full .cat-hint {
                opacity: 1;
                transform: translateY(0);
                color: rgba(245, 241, 232, 0.7);
            }

            .cat-card .cat-image {
                opacity: 1;
                transform: scale(1);
            }

            .cat-card .cat-content h2 { color: var(--beige); }
            .cat-card .cat-number { color: rgba(245, 241, 232, 0.6); }
            .cat-card .cat-hint {
                opacity: 1;
                transform: translateY(0);
                color: rgba(245, 241, 232, 0.7);
            }

            .gallery-section { padding: 80px 24px; }

            .gallery {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .gallery-item.wide { grid-column: span 2; }

            .gallery-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .footer-inner {
                grid-template-columns: 1fr;
                text-align: left;
                gap: 32px;
            }

            .footer-location { text-align: left; }
            .footer-social { text-align: left; }
            .social-links { justify-content: flex-start; }
            .footer-bottom { flex-direction: column; gap: 8px; }
        }

        /* ── ENTRANCE ANIMATIONS ── */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav id="navbar">
        <a href="index.html" class="nav-logo">Aymen Salek</a>
        <button class="nav-toggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
            <li><a href="index.html#a-propos">&Agrave; propos</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- ═══ CATEGORY CARDS ═══ -->
    <div class="categories">
        <a href="evenementiel.html" class="cat-card">
            <div class="cat-image">
                <img src="images/event-cover.jpg" alt="&Eacute;v&eacute;nementiel">
            </div>
            <div class="cat-content">
                <span class="cat-number">01</span>
                <h2>&Eacute;v&eacute;nementiel</h2>
                <span class="cat-hint">Voir les photos &rarr;</span>
            </div>
        </a>
        <a href="sport.html" class="cat-card">
            <div class="cat-image">
                <img src="images/sport-cover.jpg" alt="Sport">
            </div>
            <div class="cat-content">
                <span class="cat-number">02</span>
                <h2>Sport</h2>
                <span class="cat-hint">Voir les photos &rarr;</span>
            </div>
        </a>
    </div>

    <!-- ═══ VID&Eacute;O ═══ -->
    <a href="video.html" class="cat-card cat-card-full">
        <div class="cat-image">
            <img src="images/video-cover.jpg" alt="Vid&eacute;o">
        </div>
        <div class="cat-content">
            <span class="cat-number">03</span>
            <h2>Vid&eacute;o</h2>
            <span class="cat-hint">Voir les vid&eacute;os &rarr;</span>
        </div>
    </a>

    <!-- FOOTER -->
    <footer>
        <div class="footer-inner">
            <div class="footer-brand">
                <p class="footer-logo">Aymen Salek</p>
                <p>Photographe &amp; Vid&eacute;aste</p>
            </div>
            <div class="footer-location">
                <p class="label">Bas&eacute; &agrave;</p>
                <p>Nice, France</p>
            </div>
            <div class="footer-social">
                <p class="label">R&eacute;seaux sociaux</p>
                <div class="social-links">
                    <a href="https://www.instagram.com/aymen.photographie" target="_blank" rel="noopener">Instagram</a>
                    <a href="https://wa.me/message/3ESQMDMKOQIUE1" target="_blank" rel="noopener">WhatsApp</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <span>&copy; 2026 Aymen Salek. Tous droits r&eacute;serv&eacute;s.</span>
            <span>Nice, France</span>
        </div>
    </footer>

    <script>
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 60);
        });

        const toggle = document.querySelector('.nav-toggle');
        const navLinks = document.getElementById('navLinks');
        toggle.addEventListener('click', () => {
            navbar.classList.toggle('nav-open');
            navLinks.classList.toggle('open');
        });
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navbar.classList.remove('nav-open');
                navLinks.classList.remove('open');
            });
        });

        const faders = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });

        faders.forEach(el => observer.observe(el));
    </script>

</body>
</html>
